[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fantasy-assistant"
version = "0.1.0"
description = "Local decision-support tool for Sleeper/ESPN fantasy football leagues"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "click>=8.1",
    "PyYAML>=6.0",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "beautifulsoup4>=4.12",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "responses>=0.25",
    "httpx>=0.27",
]

[project.scripts]
fantasy-assistant = "fantasy_assistant.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/fantasy_assistant"]
